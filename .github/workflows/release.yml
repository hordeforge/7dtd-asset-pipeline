name: release

# Tag-driven releases, same shape as the other hordeforge projects: pushing
# vX.Y.Z tests the tagged tree, then publishes a GitHub Release carrying the
# sdist and wheel built from exactly that tree.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned by full commit SHA (tag in comment) so a moved tag or a
      # compromised major-version release cannot inject code into the pipeline.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: UNITYZ_INSTALL_PREFIX="$RUNNER_TEMP/unityz" scripts/install-unityz.sh
      - run: echo "$RUNNER_TEMP/unityz/bin" >> "$GITHUB_PATH"
      # uv sync provisions the interpreter itself when missing, resolves from
      # the committed uv.lock (hashes verified), and installs the dev group
      # `make check` needs.
      - run: uv sync --locked --python 3.13
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: make check test

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # The published artifact version must equal the tag, so a wheel can
      # never claim a version nobody tagged. The version's single source of
      # truth is sevendtd_asset_pipeline._version.__version__ (pyproject.toml
      # reads it dynamically), so the gate reads it there. Fails loudly rather
      # than guessing.
      - name: Check the tag matches __version__
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) echo "ERROR: tag '$TAG' does not start with 'v'" >&2; exit 1;; esac
          VERSION="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/sevendtd_asset_pipeline/_version.py)"
          if [ -z "$VERSION" ]; then
            echo "ERROR: no __version__ = \"...\" line found in src/sevendtd_asset_pipeline/_version.py" >&2
            exit 1
          fi
          if [ "$VERSION" != "${TAG#v}" ]; then
            echo "ERROR: tag $TAG but _version.py says version $VERSION; make them match before tagging" >&2
            exit 1
          fi

      - run: uv build

      # setup.py stages docs/ and scripts/ into the package at build time, and
      # `uv build` builds the wheel from the sdist. When the sdist carried no
      # top-level docs/ or scripts/, that staging step found nothing, skipped
      # without a word, and the wheel shipped whatever copy happened to be
      # staged in the build tree already. MANIFEST.in grafts the sources so it
      # cannot; this proves the published artifact against the tagged tree
      # rather than trusting that it did.
      - name: The wheel must carry this tree's docs and scripts
        shell: bash
        run: |
          set -euo pipefail
          unzip -q -o dist/*.whl -d "$RUNNER_TEMP/wheel"
          staged="$RUNNER_TEMP/wheel/sevendtd_asset_pipeline"
          scripts=0
          for file in "$staged"/scripts/*; do
            cmp -s "$file" "scripts/$(basename "$file")" ||
              { echo "ERROR: wheel's $(basename "$file") differs from scripts/" >&2; exit 1; }
            scripts=$((scripts + 1))
          done
          count=0
          while IFS= read -r page; do
            cmp -s "$staged/docs/$page" "docs/$page" ||
              { echo "ERROR: wheel's docs/$page differs from docs/" >&2; exit 1; }
            count=$((count + 1))
          done < <(cd "$staged/docs" && find . -name '*.md' -printf '%P\n')
          test "$count" -gt 0 || { echo "ERROR: the wheel carries no documentation" >&2; exit 1; }
          echo "OK: wheel carries $count documentation pages and $scripts scripts, all matching the tree"

      # A CycloneDX 1.5 inventory of exactly what the committed uv.lock
      # resolves to for the released wheel: every optional extra, no dev
      # tooling. Attached beside the artifacts so consumers and vulnerability
      # scanners can see what shipped without parsing the wheel. uv produces
      # it from the lockfile itself, so no new dependency and nothing fetched.
      - run:
          uv export --preview-features sbom-export --format cyclonedx1.5
          --no-dev --all-extras -o dist/sbom.cdx.json

      # Release notes are this version's own CHANGELOG.md section, so a
      # release cannot ship without its entry and the notes can never be
      # boilerplate that says nothing about what changed. A tag with no
      # changelog section fails here instead of publishing generic notes.
      - name: Create the GitHub Release from the changelog section
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          NOTES="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$NOTES" ]; then
            echo "ERROR: CHANGELOG.md has no ## [$VERSION] section; add one before tagging $TAG" >&2
            exit 1
          fi
          gh release create "$TAG" dist/*.whl dist/*.tar.gz dist/sbom.cdx.json \
            --title "Shamway / Asset Pipeline ${VERSION}" \
            --notes "$NOTES"
