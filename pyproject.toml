[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "7dtd-asset-pipeline"
version = "0.1.0"
description = "Build and validate Unity asset bundles for 7 Days to Die mods"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ywy50" }]
keywords = ["7-days-to-die", "7dtd", "unity", "assetbundle", "modding"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Games/Entertainment",
]

[project.scripts]
7dtd-assets = "sevendtd_asset_pipeline.cli:main"

[project.urls]
Repository = "https://github.com/ywy50/7dtd-asset-pipeline"
Issues = "https://github.com/ywy50/7dtd-asset-pipeline/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sevendtd_asset_pipeline = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
