name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run per ref: a fresh push cancels the superseded in-progress run
# instead of queueing duplicate parallel jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the pipeline only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # Actions pinned by full commit SHA (tag in comment) so a moved tag or a
      # compromised major-version release cannot inject code into the pipeline.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      # Install the core alone: the suite must pass without the optional
      # capabilities, because that is how most consumers first run it.
      # `uv sync --locked` resolves from the committed uv.lock and verifies
      # its hashes — never a fresh resolution against PyPI — and brings the
      # dev group (ruff, mypy, setuptools) that `make check` needs.
      - run: uv sync --locked --python ${{ matrix.python-version }}
      # Later steps (and the Makefile's `uv run`) resolve ./.venv from PATH.
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # Exercise the installed console script, not only the source tree, so a
      # broken entry point or missing package data fails here rather than in a
      # consumer's checkout.
      - run: shamway --help
      - run: shamway schema
      - run: make check test

  macos:
    # docs/getting-started/quickstart.md claims the CLI itself is portable beyond Linux; this
    # job is that claim's only mechanical evidence, and it gates. Lint,
    # typecheck, and the shell-script gates stay on Linux: they pin analyzer
    # versions once, and shellcheck is not part of the macOS runner image. One
    # Python version, because the Linux matrix already covers the supported
    # range.
    #
    # The suite is filesystem-honest rather than Linux-shaped: the two
    # stem-collision tests skip on a case-insensitive volume (the runner's
    # default APFS cannot hold two casings of one name, so the scenario does
    # not exist there), and path assertions compare resolved spellings so the
    # /var -> /private/var symlink does not read as a product difference.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --python 3.13
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: shamway --help
      - run: shamway schema
      - run: uv run --no-project python -m unittest discover -s tests
        env:
          PYTHONPATH: src

  capabilities:
    # The optional capabilities must also work, and must not be required.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: ./scripts/bootstrap
      - run: .venv/bin/shamway capabilities --json
      - run: .venv/bin/shamway capabilities --missing
      # make check resolves both analyzers by name; bootstrap's uv sync
      # installed the pinned dev group into the same venv.
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: make check test

  scaffold:
    # Prove the consumer path end to end on a runner that has never had a Unity
    # editor: a bare modlet is scaffolded, an asset is authored into it, a real
    # bundle is written, and every XML reference to it validates. This job is
    # the gate on the claim that Unity is opt-in — if the default path ever
    # needs an editor again, nothing else here would notice.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      # vkd3d-compiler is what turns a mesh into the prefab the game resolves.
      # Installed here so the assertion below is on the whole lane rather than
      # on its degraded form; the pipeline itself only needs Python.
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends vkd3d-compiler
      # The optional extras carry trimesh (reads the mesh) and Pillow (writes
      # the texture). Still no editor, no game install, and no network at run
      # time.
      - run: uv sync --locked --no-dev --all-extras
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Scaffold a modlet with no flags, and prove the default is editorless
        run: |
          mkdir -p /tmp/MyMod/Config
          printf '<xml><Name value="MyMod" /></xml>\n' > /tmp/MyMod/ModInfo.xml
          shamway init /tmp/MyMod --unity-version 2022.3.62f2
          test -f /tmp/MyMod/tools/shamway/AGENTS.md
          test -d /tmp/MyMod/assets-src/bundle
          # No editor was requested, so none of its scaffolding may appear.
          test ! -e /tmp/MyMod/tools/shamway/UnityProject
          grep -q 'bundle_source = "synthesized"' /tmp/MyMod/.shamway.toml
          cd /tmp/MyMod && shamway status --json || true
          cd /tmp/MyMod && shamway refs
          cd /tmp/MyMod && shamway call capabilities > /dev/null
      - name: Author an asset, build the bundle, and validate the mod against it
        env:
          UNITY_EDITOR: ""
        run: |
          cd /tmp/MyMod
          # trimesh and Pillow write the two sources directly. `shamway generate
          # mesh` would be the authoring command, but it shells out to Blender,
          # which this runner has no reason to install: what is under test is
          # the writer reading an interchange file, not how the file was made.
          python -c "import trimesh; trimesh.creation.box(extents=(0.4, 0.4, 0.4)).export('assets-src/bundle/myModThing.glb')"
          python -c "from PIL import Image; Image.new('RGBA', (64, 64), (120, 60, 40, 255)).save('assets-src/bundle/myModThing_albedo.png')"
          printf '%s\n' \
            '<configs><append xpath="/blocks"><block name="myModBlock">' \
            '<property name="Model" value="#@modfolder(MyMod):Resources/mymod.unity3d?myModThing.prefab" />' \
            '</block></append></configs>' > Config/blocks.xml
          shamway build
          shamway validate
      - name: The bundle must carry the whole prefab chain, not a bare mesh
        run: |
          cd /tmp/MyMod
          shamway inspect --deep --json Resources/mymod.unity3d > /tmp/deep.json
          python - <<'CHECK'
          import json
          types = json.load(open("/tmp/deep.json"))["type_counts"]
          required = {
              "AssetBundle", "GameObject", "Transform", "MeshFilter",
              "MeshRenderer", "Mesh", "Material", "Shader", "Texture2D",
          }
          missing = sorted(required - set(types))
          assert not missing, f"editorless bundle is missing {missing}; got {sorted(types)}"
          print("OK: every class the game resolves, written with no editor:", sorted(types))
          CHECK

  coverage-badge:
    # Publishes the line-coverage badge to the badges branch, which
    # raw.githubusercontent serves to the README. Main pushes only: a PR gets
    # its verdict from the jobs above and never sees the write token this job
    # needs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Actions pinned by full commit SHA (tag in comment) so a moved tag or a
      # compromised major-version release cannot inject code into the pipeline.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      # Core only, no dev tools: coverage runs the unit suite directly.
      - run: uv sync --locked --no-dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: make coverage
      - run: uv run --no-project --with coverage python scripts/coverage_badge.py "$RUNNER_TEMP/coverage.svg"
      - name: Publish the badge to the badges branch
        env:
          # The default token is not in the environment unless mapped here,
          # and set -u fails the step on the unbound GITHUB_TOKEN otherwise.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git clone --depth 1 --branch badges "$url" badge-repo
          else
            git init -q -b badges badge-repo
            # Only the fresh-init path needs the remote: clone already has it,
            # and adding a duplicate fails the step under set -e.
            git -C badge-repo remote add origin "$url"
          fi
          cp "$RUNNER_TEMP/coverage.svg" badge-repo/
          cd badge-repo
          git config user.name "hordeforge-ci"
          git config user.email "ci@hordeforge.noreply.github.com"
          git add coverage.svg
          git diff --cached --quiet || git commit -m "update coverage badge"
          git push origin badges
