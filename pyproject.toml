[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "7dtd-asset-pipeline"
version = "0.1.0"
description = "Build and validate Unity asset bundles for 7 Days to Die mods"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ywy50" }]
keywords = ["7-days-to-die", "7dtd", "unity", "assetbundle", "modding"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
# Deep bundle inspection: proves which objects and components actually
# survived serialization. Pin the minor version; UnityPy documents that minor
# releases may break its API.
inspect = ["UnityPy>=1.20,<2"]
# The Python authoring lanes in src/sevendtd_asset_pipeline/generators/.
authoring = ["pillow>=10", "numpy>=1.24"]
# Pre-Unity mesh checks for the Blender/OpenSCAD lane.
mesh = ["trimesh>=4"]
all = ["UnityPy>=1.20,<2", "pillow>=10", "numpy>=1.24", "trimesh>=4"]

# Lint and type-check versions are load-bearing: verdicts change between
# releases, so every checkout and every CI job must agree on exactly one.
# Declared here (PEP 735) rather than inline in ci.yml so the pins have a
# single home and land in uv.lock with hashes, which `uv sync --locked`
# verifies on every install.
[dependency-groups]
dev = ["ruff==0.16.4", "mypy==2.3.1", "setuptools"]

[project.scripts]
shamway = "sevendtd_asset_pipeline.cli:main"

[project.urls]
Repository = "https://github.com/hordeforge/7dtd-asset-pipeline"
Issues = "https://github.com/hordeforge/7dtd-asset-pipeline/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# templates/ is the Unity project init copies into a mod; docs/ is staged into
# the package by setup.py so `shamway docs` works without a checkout. The docs
# are categorized into subdirectories; ** carries them.
sevendtd_asset_pipeline = ["templates/**/*", "docs/**/*.md", "scripts/*.sh", "scripts/*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E501 stays unselected until every line is wrapped to the 100-column cap
# (about 130 sites today, mostly help text). Selecting it before that wraps
# nothing; it would only turn `make check` red. Finish the wrap, then move
# "E4", "E7", "E9" to "E".
select = [
  "E4",   # pycodestyle errors (imports, indentation, statements)
  "E7",   # pycodestyle errors (comparisons, bare except, lambdas)
  "E9",   # pycodestyle errors (runtime syntax: undefined name, duplicate arg)
  "W",    # pycodestyle warnings (trailing whitespace, missing newline)
  "F",    # pyflakes: unused imports, undefined names, f-string bugs
  "B",    # flake8-bugbear: mutable defaults, zip strictness, binding bugs
  "UP",   # pyupgrade: modernize to the supported Python floor
  "SIM",  # flake8-simplify: collapsible branches and exception handling
  "N",    # pep8-naming
  "PL",   # pylint conventions and errors (PLC0415 noqa sites rely on this)
  "BLE",  # blind except: bare `except Exception` must be justified inline
  "S",    # bandit: subprocess, temp files, XML parsing, URL schemes
  "RUF",  # ruff-specific: unused-noqa hygiene, sorted __all__
  "C4",   # comprehensions over manual accumulation
  "I",    # import sorting
]
ignore = [
  # Function-scope imports are deliberate architecture: optional capabilities
  # and heavy modules import lazily so `--help`, `status`, and every
  # non-capability command stay fast on a bare host.
  "PLC0415",
  # Structural-complexity ceilings flag the argparse dispatchers and DSP loops
  # this CLI is built from; splitting them is a code-review decision, not a
  # gate this repo has earned yet.
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",
  # Magic-value comparisons fire on every audio and colour constant in the
  # generators; those literals are the domain data.
  "PLR2004",
  # S603 fires on every subprocess.run regardless of arguments. Nothing here
  # ever passes shell=True (S602 stays armed), so the useful signal is in
  # S602/S607, not S603.
  "S603",
]

[tool.ruff.lint.per-file-ignores]
# The suite asserts with `assert`; bandit's S101 is for production paths.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
# Written against mypy 2.3.1; CI pins the same version as it pins ruff.
# Regenerable setuptools output; checking it doubles every finding.
exclude = ["^build/"]
# The optional-capability modules ship stubs only (numpy), which
# follow_imports otherwise keeps parsing regardless of the override below.
follow_imports_for_stubs = true
# Resolve `sevendtd_asset_pipeline` from the checkout and the tests' helper
# imports (`fixtures`, cross-test modules) without requiring env vars.
# explicit-package-bases keeps each file mapped under exactly one module name.
mypy_path = ["src", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# Optional capabilities: absent on most hosts, untyped or version-fragile when
# present. Their attributes are Any; our code is checked.
module = [
  "UnityPy", "UnityPy.*",
  "PIL", "PIL.*",
  "numpy", "numpy.*",
  "trimesh", "trimesh.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# Build glue only: setuptools ships types, and setup.py subclasses build_py.
module = ["setuptools", "setuptools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
